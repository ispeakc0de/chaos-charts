apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  generateName: argowf-chaossample-exec-chaos-resiliency-cron-wf-
  namespace: litmus
  labels:
    subject: "{{workflow.parameters.appNamespace}}_sample-exec-chaos"
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 0
  workflowSpec:
    entrypoint: argowf-chaos
    serviceAccountName: argo-chaos
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
    arguments:
      parameters:
        - name: adminModeNamespace
          value: "litmus"
        - name: appNamespace
          value: "bank"
    templates:
    - name: argowf-chaos
      steps:
        - - name: install-chaos-experiments
            template: install-chaos-experiments
        - - name: sample-exec-chaos
            template: sample-exec-chaos
        - - name: revert-chaos
            template: revert-chaos

    - name: install-chaos-experiments
      arguments: {}
      inputs:
        artifacts:
          - name: sample-exec-chaos
            path: /tmp/sample-exec-chaos.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                description:
                  message: |
                    Injects cpu consumption on pods belonging to an app deployment
                kind: ChaosExperiment

                metadata:
                  name: sample-exec-chaos
                  labels:
                    name: sample-exec-chaos
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: chaosexperiment
                    app.kubernetes.io/version: 1.13.8
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups:
                          - ""
                          - batch
                          - apps
                          - apps.openshift.io
                          - argoproj.io
                          - litmuschaos.io
                        resources:
                          - jobs
                          - pods
                          - pods/log
                          - events
                          - replicationcontrollers
                          - deployments
                          - statefulsets
                          - daemonsets
                          - replicasets
                          - deploymentconfigs
                          - rollouts
                          - pods/exec
                          - chaosengines
                          - chaosexperiments
                          - chaosresults
                        verbs:
                          - create
                          - list
                          - get
                          - patch
                          - update
                          - delete
                    image: shubh214/py-runner:ci
                    imagePullPolicy: Always
                    args:
                      - -c
                      - python3 -u experiment -name=sample-exec-chaos
                    command:
                      - /bin/bash
                    env:
                      - name: TOTAL_CHAOS_DURATION
                        value: "60"
                      - name: CPU_CORES
                        value: "1"
                      - name: PODS_AFFECTED_PERC
                        value: ""
                      - name: RAMP_TIME
                        value: ""
                      - name: LIB
                        value: litmus
                      - name: TARGET_PODS
                        value: ""
                      - name: SEQUENCE
                        value: parallel
                    labels:
                      name: sample-exec-chaos
                      app.kubernetes.io/part-of: litmus
                      app.kubernetes.io/component: experiment-job
                      app.kubernetes.io/version: 1.13.8
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: litmuschaos/k8s:latest
        command:
          - sh
          - -c
        args:
          - kubectl apply -f /tmp/sample-exec-chaos.yaml -n
            {{workflow.parameters.adminModeNamespace}} |  sleep 30
        resources: {}
    - name: sample-exec-chaos
      arguments: {}
      inputs:
        artifacts:
          - name: sample-exec-chaos
            path: /tmp/chaosengine-sample-exec-chaos.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: sample-exec-chaos
                  labels:
                    instance_id: b94f072a-9706-4e8d-8ffe-f690462dc2ea
                    workflow_name: custom-chaos-workflow-1628842040
                spec:
                  engineState: active
                  appinfo:
                    appns: default
                    applabel: app=nginx
                    appkind: deployment
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: sample-exec-chaos
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: CPU_CORES
                              value: "1"
                            - name: PODS_AFFECTED_PERC
                              value: "100"
                            - name: CHAOS_INJECT_COMMAND
                              value: md5sum /dev/zero &
                            - name: CHAOS_KILL_COMMAND
                              value: kill $(find /proc -name exe -lname '*/md5sum' 2>&1 | grep -v 'Permission
                                denied' | awk -F/ '{print $(NF-1)}')
      outputs: {}
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: litmuschaos/litmus-checker:latest
        args:
          - -file=/tmp/chaosengine-sample-exec-chaos.yaml
          - -saveName=/tmp/engine-name
        resources: {}